name: Build NOVA APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare offline Android project
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          files = json.loads(r'''
          {
            "settings.gradle": "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories { google(); mavenCentral() }\n}\nrootProject.name = 'NovaCalculator'\ninclude ':app'\n",
            "build.gradle": "plugins { id 'com.android.application' version '8.7.3' apply false }\n",
            "gradle.properties": "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n",
            "app/build.gradle": "plugins { id 'com.android.application' }\nandroid {\n    namespace 'com.nova.offlinecalculator'\n    compileSdk 35\n    defaultConfig {\n        applicationId 'com.nova.offlinecalculator'\n        minSdk 23\n        targetSdk 35\n        versionCode 1\n        versionName '1.0'\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\n",
            "app/src/main/AndroidManifest.xml": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <!-- No INTERNET permission. All content is bundled with the APK. -->\n    <application android:allowBackup=\"false\" android:label=\"ماشین‌حساب نوا\"\n        android:icon=\"@drawable/ic_nova\" android:supportsRtl=\"true\"\n        android:usesCleartextTraffic=\"false\" android:theme=\"@android:style/Theme.Material.NoActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\"\n            android:windowSoftInputMode=\"adjustResize\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n",
            "app/src/main/res/drawable/ic_nova.xml": "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:width=\"108dp\" android:height=\"108dp\" android:viewportWidth=\"108\" android:viewportHeight=\"108\">\n    <path android:fillColor=\"#10121C\" android:pathData=\"M0,0h108v108h-108z\" />\n    <path android:fillColor=\"#AB9CFF\" android:pathData=\"M30,25h48v10h-31l19,19 -19,19h31v10h-48v-10l19,-19 -19,-19z\" />\n</vector>\n",
            "app/src/main/java/com/nova/offlinecalculator/MainActivity.java": "package com.nova.offlinecalculator;\n\nimport android.app.Activity;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.graphics.Color;\nimport android.content.ClipData;\nimport android.content.ClipboardManager;\nimport android.content.Context;\nimport android.view.WindowInsets;\nimport android.webkit.*;\nimport android.widget.FrameLayout;\nimport java.io.ByteArrayInputStream;\nimport java.io.IOException;\n\npublic class MainActivity extends Activity {\n    private static final String HOME = \"https://appassets.androidplatform.net/index.html\";\n    private WebView webView;\n\n    @Override public void onCreate(Bundle state) {\n        super.onCreate(state);\n        FrameLayout root = new FrameLayout(this);\n        root.setBackgroundColor(Color.rgb(16, 18, 28));\n        setContentView(root);\n        // Native insets keep ALL calculator buttons outside system bars and cutouts.\n        root.setOnApplyWindowInsetsListener((view, insets) -> {\n            if (Build.VERSION.SDK_INT >= 30) {\n                android.graphics.Insets bars = insets.getInsets(\n                    WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout()\n                    | WindowInsets.Type.ime());\n                view.setPadding(bars.left, bars.top, bars.right, bars.bottom);\n            } else {\n                view.setPadding(insets.getSystemWindowInsetLeft(), insets.getSystemWindowInsetTop(),\n                    insets.getSystemWindowInsetRight(), insets.getSystemWindowInsetBottom());\n            }\n            return insets;\n        });\n        webView = new WebView(this);\n        webView.setBackgroundColor(Color.rgb(16,18,28));\n        root.addView(webView, new FrameLayout.LayoutParams(-1,-1));\n        WebSettings settings = webView.getSettings();\n        settings.setJavaScriptEnabled(true);\n        settings.setDomStorageEnabled(true);\n        settings.setAllowFileAccess(false);\n        settings.setAllowContentAccess(false);\n        settings.setAllowFileAccessFromFileURLs(false);\n        settings.setAllowUniversalAccessFromFileURLs(false);\n        settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);\n        settings.setJavaScriptCanOpenWindowsAutomatically(false);\n        webView.setWebChromeClient(new WebChromeClient());\n        // HTTPS origin is served exclusively from bundled assets, without networking.\n        webView.setWebViewClient(new WebViewClient() {\n            @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {\n                return !HOME.equals(req.getUrl().toString());\n            }\n            @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {\n                return !HOME.equals(url);\n            }\n            @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req) {\n                if (HOME.equals(req.getUrl().toString())) {\n                    try {\n                        WebResourceResponse response = new WebResourceResponse(\"text/html\", \"UTF-8\", getAssets().open(\"index.html\"));\n                        java.util.Map<String,String> headers = new java.util.HashMap<>();\n                        headers.put(\"Content-Security-Policy\", \"default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; frame-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'\");\n                        response.setResponseHeaders(headers);\n                        return response;\n                    } catch (IOException ignored) { }\n                }\n                return new WebResourceResponse(\"text/plain\", \"UTF-8\", new ByteArrayInputStream(new byte[0]));\n            }\n        });\n        // Only the bundled page can run scripts. No arbitrary pages or frames are allowed.\n        webView.addJavascriptInterface(new Object() {\n            @JavascriptInterface public void copy(String value) {\n                if (value == null || value.length() > 1000) return;\n                runOnUiThread(() -> {\n                    ClipboardManager clipboard = (ClipboardManager)getSystemService(Context.CLIPBOARD_SERVICE);\n                    clipboard.setPrimaryClip(ClipData.newPlainText(\"NOVA result\", value));\n                });\n            }\n        }, \"NovaClipboard\");\n        webView.loadUrl(HOME);\n        root.requestApplyInsets();\n    }\n    @Override protected void onPause() {\n        if (webView != null) webView.onPause();\n        super.onPause();\n    }\n    @Override protected void onResume() {\n        super.onResume();\n        if (webView != null) webView.onResume();\n    }\n    @Override protected void onDestroy() {\n        if (webView != null) {\n            ((FrameLayout)webView.getParent()).removeView(webView);\n            webView.removeJavascriptInterface(\"NovaClipboard\");\n            webView.destroy();\n        }\n        super.onDestroy();\n    }\n}\n"
          }
          ''')
          for name, content in files.items():
              path = pathlib.Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          assets = pathlib.Path('app/src/main/assets')
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copyfile('index.html', assets / 'index.html')
          PY

      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NOVA-Calculator-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Calculator-APK
          path: NOVA-Calculator-debug.apk
          if-no-files-found: error
          retention-days: 30
