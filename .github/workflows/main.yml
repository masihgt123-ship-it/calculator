name: Build NOVA Signed Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare offline Android project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          files = {
              "settings.gradle": r'''pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'NovaCalculator'
          include ':app'
          ''',
              "build.gradle": r'''plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          ''',
              "gradle.properties": r'''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          ''',
              "app/build.gradle": r'''plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nova.offlinecalculator'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nova.offlinecalculator'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv('NOVA_KEYSTORE_FILE'))
                      storePassword System.getenv('NOVA_STORE_PASSWORD')
                      keyAlias 'iirco'
                      keyPassword System.getenv('NOVA_STORE_PASSWORD')
                      storeType 'PKCS12'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ''',
              "app/src/main/AndroidManifest.xml": r'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="ماشین‌حساب نوا"
                  android:icon="@drawable/ic_nova"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''',
              "app/src/main/res/drawable/ic_nova.xml": r'''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#10121C"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#AB9CFF"
                  android:pathData="M30,25h48v10h-31l19,19 -19,19h31v10h-48v-10l19,-19 -19,-19z" />
          </vector>
          ''',
              "app/src/main/java/com/nova/offlinecalculator/MainActivity.java": r'''package com.nova.offlinecalculator;

          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.view.WindowInsets;
          import android.webkit.*;
          import android.widget.FrameLayout;
          import java.io.ByteArrayInputStream;
          import java.io.IOException;

          public class MainActivity extends Activity {
              private static final String HOME =
                  "https://appassets.androidplatform.net/index.html";

              private WebView webView;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(16, 18, 28));
                  setContentView(root);

                  // Keep buttons clear of system bars and display cutouts.
                  root.setOnApplyWindowInsetsListener((view, insets) -> {
                      if (Build.VERSION.SDK_INT >= 30) {
                          android.graphics.Insets bars = insets.getInsets(
                              WindowInsets.Type.systemBars()
                              | WindowInsets.Type.displayCutout()
                              | WindowInsets.Type.ime()
                          );
                          view.setPadding(
                              bars.left, bars.top, bars.right, bars.bottom
                          );
                      } else {
                          view.setPadding(
                              insets.getSystemWindowInsetLeft(),
                              insets.getSystemWindowInsetTop(),
                              insets.getSystemWindowInsetRight(),
                              insets.getSystemWindowInsetBottom()
                          );
                      }
                      return insets;
                  });

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(16, 18, 28));
                  root.addView(
                      webView,
                      new FrameLayout.LayoutParams(-1, -1)
                  );

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setAllowFileAccessFromFileURLs(false);
                  settings.setAllowUniversalAccessFromFileURLs(false);
                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  );
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);

                  webView.setWebChromeClient(new WebChromeClient());

                  // Serve the bundled HTML locally, without internet access.
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, WebResourceRequest req
                      ) {
                          return !HOME.equals(req.getUrl().toString());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, String url
                      ) {
                          return !HOME.equals(url);
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                          WebView view, WebResourceRequest req
                      ) {
                          if (HOME.equals(req.getUrl().toString())) {
                              try {
                                  WebResourceResponse response =
                                      new WebResourceResponse(
                                          "text/html",
                                          "UTF-8",
                                          getAssets().open("index.html")
                                      );

                                  java.util.Map<String, String> headers =
                                      new java.util.HashMap<>();

                                  headers.put(
                                      "Content-Security-Policy",
                                      "default-src 'none'; "
                                      + "script-src 'unsafe-inline'; "
                                      + "style-src 'unsafe-inline'; "
                                      + "img-src data:; "
                                      + "frame-src 'none'; "
                                      + "connect-src 'none'; "
                                      + "form-action 'none'; "
                                      + "base-uri 'none'"
                                  );

                                  response.setResponseHeaders(headers);
                                  return response;
                              } catch (IOException ignored) {
                              }
                          }

                          return new WebResourceResponse(
                              "text/plain",
                              "UTF-8",
                              new ByteArrayInputStream(new byte[0])
                          );
                      }
                  });

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void copy(String value) {
                          if (value == null || value.length() > 1000) return;

                          runOnUiThread(() -> {
                              ClipboardManager clipboard =
                                  (ClipboardManager) getSystemService(
                                      Context.CLIPBOARD_SERVICE
                                  );
                              clipboard.setPrimaryClip(
                                  ClipData.newPlainText("NOVA result", value)
                              );
                          });
                      }
                  }, "NovaClipboard");

                  webView.loadUrl(HOME);
                  root.requestApplyInsets();
              }

              @Override
              protected void onPause() {
                  if (webView != null) webView.onPause();
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      ((FrameLayout) webView.getParent()).removeView(webView);
                      webView.removeJavascriptInterface("NovaClipboard");
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          ''',
          }

          for name, content in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")

          assets = Path("app/src/main/assets")
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copyfile("index.html", assets / "index.html")
          PY

      - name: Restore and check signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.HECTOR }}
          NOVA_STORE_PASSWORD: ${{ secrets.HECTOR1 }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${NOVA_STORE_PASSWORD:-}" ]; then
            echo "Missing HECTOR or HECTOR1 repository secret."
            exit 1
          fi

          python3 - <<'PY'
          import os
          import base64
          from pathlib import Path

          data = ''.join(os.environ['KEYSTORE_BASE64'].split())
          key = base64.b64decode(data, validate=True)

          if not key:
              raise SystemExit('HECTOR contains no key data.')

          Path(
              os.environ['RUNNER_TEMP'],
              'nova-release.jks'
          ).write_bytes(key)
          PY

          keytool -list \
            -keystore "$RUNNER_TEMP/nova-release.jks" \
            -storetype PKCS12 \
            -storepass:env NOVA_STORE_PASSWORD \
            -alias iirco > /dev/null

      - name: Build signed APK and AAB
        env:
          NOVA_KEYSTORE_FILE: ${{ runner.temp }}/nova-release.jks
          NOVA_STORE_PASSWORD: ${{ secrets.HECTOR1 }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify release signatures
        shell: bash
        env:
          NOVA_STORE_PASSWORD: ${{ secrets.HECTOR1 }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$SIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"

          keytool -exportcert -rfc \
            -keystore "$RUNNER_TEMP/nova-release.jks" \
            -storetype PKCS12 \
            -storepass:env NOVA_STORE_PASSWORD \
            -alias iirco > "$RUNNER_TEMP/nova-cert.pem"

          EXPECTED=$(openssl x509 -in "$RUNNER_TEMP/nova-cert.pem" -outform DER | sha256sum | cut -d ' ' -f 1)
          ACTUAL=$("$SIGNER" verify --print-certs "$APK" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')

          test "$EXPECTED" = "$ACTUAL"

          mkdir -p release-output
          cp "$APK" release-output/NOVA-Calculator-v1.0-release.apk
          cp "$AAB" release-output/NOVA-Calculator-v1.0-release.aab

          cd release-output
          sha256sum *.apk *.aab > SHA256SUMS.txt

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Signed-Release-v1.0
          path: release-output/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nova-release.jks" "$RUNNER_TEMP/nova-cert.pem"
        
